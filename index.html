<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barock-Meister: Das Quiz</title>
    <!-- Schöne Barock-ähnliche Schriftarten von Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <!-- Konfetti-Bibliothek für die Belohnungs-Animation -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --crimson: #5a000f;
            --crimson-dark: #360009;
            --parchment: #fdfbf7;
            --correct: #2e7d32;
            --wrong: #c62828;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Lora', serif;
            background: radial-gradient(circle, var(--crimson) 0%, var(--crimson-dark) 100%);
            color: #2c221e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .game-card {
            background: var(--parchment);
            width: 100%;
            max-width: 520px;
            border-radius: 16px;
            border: 5px double var(--gold);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 15px rgba(212, 175, 55, 0.4);
            padding: 25px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: var(--crimson);
            font-size: 1.7rem;
            margin-bottom: 8px;
            text-shadow: 1px 1px 0px var(--gold);
        }

        .subtitle {
            font-style: italic;
            color: #665;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .ornament {
            color: var(--gold);
            font-size: 1.4rem;
            margin: 8px 0 15px 0;
            letter-spacing: 5px;
        }

        /* Fortschrittsbalken */
        .progress-container {
            width: 100%;
            height: 10px;
            background: #e6dec8;
            border-radius: 5px;
            margin-bottom: 15px;
            border: 1px solid var(--gold);
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--crimson), var(--gold));
            width: 0%;
            transition: width 0.4s ease;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--crimson);
            margin-bottom: 12px;
        }

        /* Fragen und Antworten */
        .question-box {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
            min-height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: #fff;
            border: 2px solid var(--gold);
            border-radius: 10px;
            padding: 13px 15px;
            font-family: 'Lora', serif;
            font-size: 1rem;
            color: #2c221e;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            box-shadow: 0 3px 6px rgba(0,0,0,0.05);
        }

        .option-btn:hover:not(:disabled) {
            background: var(--gold-light);
            transform: translateY(-2px);
        }

        .option-btn.correct {
            background: var(--correct);
            color: white;
            border-color: #1b5e20;
            animation: pulseSuccess 0.5s ease;
        }

        .option-btn.wrong {
            background: var(--wrong);
            color: white;
            border-color: #b71c1c;
            animation: shakeError 0.4s ease;
        }

        /* Feedback und Lob */
        .feedback {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            display: none;
            font-size: 0.95rem;
            line-height: 1.4;
            animation: fadeIn 0.3s ease;
        }

        .feedback.success {
            background: #e8f5e9;
            color: #1b5e20;
            border: 1px solid #a5d6a7;
        }

        .feedback.error {
            background: #ffebee;
            color: #b71c1c;
            border: 1px solid #ef9a9a;
        }

        /* Buttons */
        .btn-main {
            margin-top: 18px;
            background: linear-gradient(135deg, var(--crimson), #800016);
            color: var(--gold-light);
            border: 2px solid var(--gold);
            padding: 12px 26px;
            font-family: 'Cinzel', serif;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        .btn-main:hover {
            transform: scale(1.04);
        }

        .hidden {
            display: none !important;
        }

        .trophy {
            font-size: 4rem;
            margin: 10px 0;
            animation: bounce 1.2s infinite alternate;
        }

        /* Animationen */
        @keyframes pulseSuccess {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        @keyframes shakeError {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

<div class="game-card">
    <!-- STARTBILDSCHIRM -->
    <div id="start-screen">
        <div class="ornament">⚜ 🎻 ⚜</div>
        <h1>Zeitalter des Barock</h1>
        <p class="subtitle">Teste dein Wissen über das Barock, die venezianische Mehrchörigkeit & das Concerto grosso!</p>
        <p style="margin-bottom: 20px; font-size: 0.95rem;">Schaffst du es, alle 10 Fragen richtig zu beantworten und zum Hofkapellmeister aufzusteigen?</p>
        <button class="btn-main" onclick="startGame()">Spiel starten</button>
    </div>

    <!-- QUIZ-BILDSCHIRM -->
    <div id="quiz-screen" class="hidden">
        <div class="stats">
            <span id="question-counter">Frage 1 / 10</span>
            <span id="score-counter">⚜ Punkte: 0</span>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="question-box" id="question-text"></div>
        <div class="options" id="options-container"></div>
        <div class="feedback" id="feedback-box"></div>
        <button class="btn-main hidden" id="next-btn" onclick="nextQuestion()">Weiter ➔</button>
    </div>

    <!-- ENDBILDSCHIRM -->
    <div id="end-screen" class="hidden">
        <div class="ornament">⚜ 👑 ⚜</div>
        <h1>Geschafft!</h1>
        <div class="trophy" id="end-trophy">🏆</div>
        <p id="final-score" style="font-size: 1.3rem; font-weight: bold; color: var(--crimson); margin-bottom: 10px;"></p>
        <p id="final-praise" style="margin-bottom: 20px; line-height: 1.5;"></p>
        <button class="btn-main" onclick="restartGame()">Noch einmal spielen</button>
    </div>
</div>

<script>
    const questions = [
        {
            q: "Welchen Zeitraum umfasst die glanzvolle Epoche des Barock?",
            options: ["ca. 1450 – 1600", "ca. 1600 – 1750", "ca. 1750 – 1820", "ca. 1800 – 1900"],
            answer: 1,
            praise: "Bravissimo! Genau, von 1600 bis 1750 entfaltete sich die üppige Pracht des Barock."
        },
        {
            q: "Was bedeutet das portugiesische Wort „barroco“, von dem sich der Name der Epoche ableitet?",
            options: ["Goldene Krone", "Großes Konzert", "Unregelmäßige Perle", "Starker König"],
            answer: 2,
            praise: "Grandios! Es bedeutet „unregelmäßige Perle“ und bezog sich auf die geschwungenen Linien und Verzierungen."
        },
        {
            q: "Welche Staatsform prägte das Zeitalter des Barock (bekannt durch Ludwig XIV.: „Der Staat bin ich“)?",
            options: ["Demokratie", "Absolutismus", "Republik", "Anarchie"],
            answer: 1,
            praise: "Majestätisch! Der Absolutismus und die Kirche bestimmten diese Epoche."
        },
        {
            q: "Welche Kirche war durch ihre vier Emporen der Ursprungsort der venezianischen Mehrchörigkeit?",
            options: ["Kölner Dom", "Petersdom in Rom", "Markusdom (San Marco) in Venedig", "Notre-Dame in Paris"],
            answer: 2,
            praise: "Fantastisch! Im Markusdom in Venedig sorgten die 4 Emporen für beeindruckende Raumeffekte."
        },
        {
            q: "Welche beiden Komponisten machten die venezianische Mehrchörigkeit in San Marco berühmt?",
            options: ["Andrea & Giovanni Gabrieli", "Wolfgang & Leopold Mozart", "Ludwig van Beethoven & Joseph Haydn", "Clara & Robert Schumann"],
            answer: 0,
            praise: "Hervorragend! Andrea und Giovanni Gabrieli platzierten die Chöre auf den Emporen."
        },
        {
            q: "Was ist das typische Merkmal der „venezianischen Mehrchörigkeit“?",
            options: [
                "Ein einzelner Sänger singt ganz ohne Instrumente.",
                "Mehrere Chöre (vokal und/oder instrumental) musizieren gemeinsam und abwechselnd.",
                "Es dürfen ausschließlich Schlaginstrumente gespielt werden.",
                "Alle Musiker sitzen versteckt hinter einem Vorhang."
            ],
            answer: 1,
            praise: "Exzellent! Dadurch entstehen tolle musikalische Kontraste, Klangfülle und Raumeffekte."
        },
        {
            q: "Was bedeutet der Begriff „Concerto grosso“ übersetzt und nach welchem Prinzip funktioniert es?",
            options: [
                "„Kleines Lied“ – Ein Solist singt zur Laute.",
                "„Großes Ensemble“ – Eine große Gruppe (Tutti/Ripieno) musiziert im Wechsel mit einer kleinen Gruppe (Concertino).",
                "„Stilles Gebet“ – Sehr leise Kirchenmusik für Flöte.",
                "„Schneller Tanz“ – Alle Instrumente spielen durchgehend genau dasselbe."
            ],
            answer: 1,
            praise: "Meisterhaft! Es ist ein musikalischer Wettstreit zwischen dem großen Tutti und dem kleinen Concertino."
        },
        {
            q: "Wie nennt man die kleinere, meist solistisch besetzte Gruppe im Concerto grosso?",
            options: ["Tutti", "Ripieno", "Concertino", "Basso"],
            answer: 2,
            praise: "Volltreffer! Das „Concertino“ ist die kleine Solistengruppe, die mit dem großen Orchester (Tutti/Ripieno) wetteifert."
        },
        {
            q: "Was versteht man unter dem „Basso continuo“ (durchgehender Bass)?",
            options: [
                "Eine große Trommel, die den Takt schlägt.",
                "Eine durchgehende Bassbegleitung aus einem Harmonieinstrument (z.B. Cembalo) und einem Bassinstrument (z.B. Cello).",
                "Einen extrem tief singenden Männerchor.",
                "Eine Pause, in der alle tiefen Instrumente schweigen."
            ],
            answer: 1,
            praise: "Virtuos gelöst! Harmonieinstrument (wie Cembalo/Orgel) und Bassinstrument (wie Violoncello/Fagott) bilden das Fundament."
        },
        {
            q: "Welches berühmte Werk von Johann Sebastian Bach ist ein bekanntes Beispiel für das Concerto grosso?",
            options: ["Die Zauberflöte", "Die Brandenburgischen Konzerte", "Für Elise", "Die vier Jahreszeiten"],
            answer: 1,
            praise: "Genial! Die „Brandenburgischen Konzerte“ von J. S. Bach sind weltberühmte Concerti grossi!"
        }
    ];

    const praiseTitles = [
        "🎵 Wunderbar!", "✨ Bravissimo!", "👑 Majestätisch!", 
        "🎻 Virtuos!", "🌟 Grandios!", "⚜ Meisterhaft!"
    ];

    let currentIdx = 0;
    let score = 0;

    function startGame() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        currentIdx = 0;
        score = 0;
        loadQuestion();
    }

    function loadQuestion() {
        const qData = questions[currentIdx];
        document.getElementById('question-counter').innerText = `Frage ${currentIdx + 1} / ${questions.length}`;
        document.getElementById('score-counter').innerText = `⚜ Punkte: ${score}`;
        document.getElementById('progress-bar').style.width = `${(currentIdx / questions.length) * 100}%`;
        
        document.getElementById('question-text').innerText = qData.q;
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        document.getElementById('feedback-box').style.display = 'none';
        document.getElementById('feedback-box').className = 'feedback';
        document.getElementById('next-btn').classList.add('hidden');

        qData.options.forEach((optText, i) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = optText;
            btn.onclick = () => selectAnswer(i, btn);
            optionsContainer.appendChild(btn);
        });
    }

    function selectAnswer(selectedIdx, btnElement) {
        const qData = questions[currentIdx];
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.disabled = true);

        const feedbackBox = document.getElementById('feedback-box');
        feedbackBox.style.display = 'block';

        if (selectedIdx === qData.answer) {
            btnElement.classList.add('correct');
            score++;
            document.getElementById('score-counter').innerText = `⚜ Punkte: ${score}`;
            
            const randomTitle = praiseTitles[Math.floor(Math.random() * praiseTitles.length)];
            feedbackBox.classList.add('success');
            feedbackBox.innerHTML = `<strong>${randomTitle}</strong><br>${qData.praise}`;
            
            // Gold-Rotes Barock-Konfetti bei richtiger Antwort!
            confetti({
                particleCount: 55,
                spread: 60,
                origin: { y: 0.75 },
                colors: ['#d4af37', '#f3e5ab', '#800016', '#ffffff']
            });
        } else {
            btnElement.classList.add('wrong');
            allBtns[qData.answer].classList.add('correct');
            feedbackBox.classList.add('error');
            feedbackBox.innerHTML = `<strong>Nicht ganz!</strong><br>Die richtige Antwort ist grün markiert. Merke dir: ${qData.praise.replace(/^[^!]+!\s*/, '')}`;
        }

        document.getElementById('next-btn').classList.remove('hidden');
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < questions.length) {
            loadQuestion();
        } else {
            showEndScreen();
        }
    }

    function showEndScreen() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = `${score} von ${questions.length} Punkten erreicht!`;

        let msg = "";
        let trophy = "🏆";
        if (score === 10) {
            msg = "Absolut perfekt! Du bist ein wahrer Hofkapellmeister des Barock! Selbst Johann Sebastian Bach und Giovanni Gabrieli wären stolz auf dich!";
            trophy = "👑";
            confetti({ particleCount: 140, spread: 100, origin: { y: 0.6 } });
        } else if (score >= 7) {
            msg = "Bravissimo! Du kennst dich schon richtig gut mit dem Barock, der Mehrchörigkeit und dem Concerto grosso aus!";
            trophy = "🎻";
            confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
        } else if (score >= 4) {
            msg = "Guter Anfang! Einige Fachbegriffe sitzen schon, schau dir den Infotext noch einmal kurz an, um alle Fragen zu knacken.";
            trophy = "📜";
        } else {
            msg = "Noch etwas Übung nötig! Lies dir das Arbeitsblatt zum Barock noch einmal in Ruhe durch und probiere es gleich noch einmal.";
            trophy = "🕯️";
        }
        document.getElementById('end-trophy').innerText = trophy;
        document.getElementById('final-praise').innerText = msg;
    }

    function restartGame() {
        document.getElementById('end-screen').classList.add('hidden');
        startGame();
    }
</script>

</body>
</html>
